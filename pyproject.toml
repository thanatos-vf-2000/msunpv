[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "msunpv"
version = "1.0.0"
authors = [
  { name="Franck VANHOUCKE", email="vanhoucke.franck@free.fr" },
]
maintainers = [
  { name="Franck VANHOUCKE", email="vanhoucke.franck@free.fr" },
]

description = "Library to interface an msunpv devices."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Home Automation",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp>=3,<4",
  "xmltodict"
]
keywords = ["msunpv", "sun", "solar router", "self-consumption", "ard-tek"]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/thanatos-vf-2000/msunpv"
Repository = "https://github.com/thanatos-vf-2000/msunpv"
Issues = "https://github.com/thanatos-vf-2000/msunpv/issues"
Documents = "https://thanatos-vf-2000.github.io/msunpv/"
Changelog = "https://github.com/thanatos-vf-2000/msunpv/blob/main/CHANGELOG.md"